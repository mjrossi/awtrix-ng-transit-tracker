# urbanist-timetable configuration. Copy to config.toml and edit.
#
# ${NAME} in the [clock] and [providers.*] settings is replaced with the
# environment variable NAME, so secrets can stay out of the file. A missing
# variable is an error.

# IANA time zone for active_hours. Empty uses the TZ environment variable.
# A board's own `timezone` overrides it; "Local" there means the TZ zone.
timezone = "Europe/Lisbon"

[clock]
# Your AWTRIX NG clock: its IP address or awtrixng-<last 6 MAC hex>.local.
url = "http://awtrixng-a1b2c3.local"
# Only if the clock has authEnabled:
# username = "admin"
# password = "${AWTRIX_PASSWORD}"

# Each [providers.NAME] block configures one data source. Boards refer to
# it by NAME. NAME is also the provider type unless the block sets `type`,
# so one type can serve several agencies. Find stop IDs with:
#   urbanist-timetable stops search <NAME> <words...>
#
# Ready-made systems: list them with `urbanist-timetable systems`, and
# `urbanist-timetable systems show <id>` prints the block to paste here.
# [providers.nyc]
# system = "nyc-subway"
#
# Any other agency with GTFS and GTFS-Realtime TripUpdates works through
# the generic provider. Find feed URLs at https://mobilitydatabase.org/.
# A station ID covers all its platforms; a platform ID (such as "127S")
# narrows to one direction.
# [providers.nyc]
# type = "gtfsrt"
# static_url = "http://web.mta.info/developers/data/nyct/subway/google_transit.zip"
# realtime_urls = ["https://api-endpoint.mta.info/Dataservice/mtagtfsfeeds/nyct%2Fgtfs"]
# headers = { "X-Api-Key" = "${NYC_KEY}" }   # only for feeds that need a key
#
# Carris Metropolitana: regional buses in the Lisbon metropolitan area.
# Open API, no key needed.
[providers.carrismetropolitana]

# Metro de Lisboa: needs an application subscribed to EstadoServicoML at
# https://api.metrolisboa.pt/store/ (client-credentials grant, OAuth
# tokens). Keep the keys in the environment, for example in
# mise.local.toml. Station IDs are two letters, such as "BC".
# [providers.metrolisboa]
# client_id = "${LISBON_METRO_CLIENT_ID}"
# client_secret = "${LISBON_METRO_CLIENT_SECRET}"

# The demo provider generates departures from fixed headways. Use it to see
# the display working before configuring a real transit API.
[providers.demo]
[[providers.demo.lines]]
id = "azul"
short_name = "Azul"
color = "#0072CE"
mode = "metro"
headsign = "Santa Apolónia"
headway = "6m"
offset = "1m"
realtime = true

[[providers.demo.lines]]
id = "verde"
short_name = "Verde"
color = "#00A651"
mode = "metro"
headsign = "Telheiras"
headway = "8m"
offset = "3m"

# Each [[boards]] entry is one app on the clock, and the clock rotates
# through its apps. With the default "departure" layout a board shows one
# line and direction like a platform sign:
#
#   Sta Apolónia
#   ▌ 3  8  14
#
# so pin each board to one direction with `lines` and `headsigns`, and add a
# board per direction you want. Unpinned, it keeps to the first line and
# direction in name order that has departures.
[[boards]]
# App name on the clock: 1-32 letters, digits, - or _.
name = "azul"
# How often to fetch and push. Minimum 15s.
poll_interval = "45s"
# How far ahead to look for departures.
window = "60m"
# Leave empty to show the board all day.
active_hours = "06:30-23:30"
# Departure times to show (fewer if they do not fit).
per_row = 3
# Optional:
# timezone = "Europe/Madrid"  # IANA zone for this board's active_hours
# max_stale = "10m"   # reuse the last good data this long while a provider fails

# How the board looks on the clock. Every setting is optional.
[boards.clock]
# layout = "rows"     # one line and direction per row, two rows; suits busy bus stops
# max_rows = 2        # rows layout only
# overflow = "clip"   # names too wide for the display are cut off instead of scrolling
# lifetime = "135s"   # app is removed this long after the last push (default 3 × poll_interval)
# duration = "10s"    # time on screen per rotation (default: the clock's setting)
# font = "small"
# name_font = "small" # font of destination names. By default names with accents above
                      # letters use matrix-light6, which needs AWTRIX NG 1.2.2 or later
# empty_text = "No departures"

# Shorter display names. About 13 characters fit across the display;
# `urbanist-timetable preview` marks names that will scroll.
[boards.clock.labels]
"Santa Apolónia" = "Sta Apolónia"

[[boards.stops]]
provider = "demo"
stop = "baixa-chiado"
lines = ["azul"]                 # line IDs or short names
headsigns = ["Santa Apolónia"]   # substrings of the destination
# min_lead = "4m"                # hide departures you cannot reach in time
# keep_canceled = true           # show canceled trips struck through

[[boards]]
name = "verde"
poll_interval = "45s"
active_hours = "06:30-23:30"

[[boards.stops]]
provider = "demo"
stop = "baixa-chiado"
lines = ["verde"]

# Live Carris Metropolitana buses. A busy stop may suit the rows layout.
# [[boards]]
# name = "bus"
# poll_interval = "60s"
#
# [boards.clock]
# layout = "rows"
#
# [[boards.stops]]
# provider = "carrismetropolitana"
# stop = "060001"
