# Pinned tool versions. Install mise (https://mise.jdx.dev), then run
# `mise install` at the repo root.
#
# Overlays: mise.ci.toml (MISE_ENV=ci) and an uncommitted mise.local.toml.

[tools]
go = "1.27.3"
"aqua:casey/just" = "1.51.0"
"aqua:golangci/golangci-lint" = "2.15.0"
"aqua:goreleaser/goreleaser" = "2.20.3"

[env]
# The CLI defaults to ~/.config/urbanist-timetable/config.toml; work in this
# repository uses its own config.toml.
TIMETABLE_CONFIG = "config.toml"
TIMETABLE_LOG_FORMAT = "json"
TIMETABLE_LOG_LEVEL = "info"
